name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Skipped: the internal/escapes fixture tests read the operator's live tk
      # store (~/.ticket, the tk binary) and the checkouts of every project the
      # fixture labels, none of which exist on the runner. The rest of that
      # package's tests run here.
      - name: Run tests
        run: go test -skip '^(TestFixtureWellFormed|TestFixtureCommitsResolve|TestPrecisionAgainstFixture)$' ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
